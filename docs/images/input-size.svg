<text x="336" y="232.0" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6e6c66">Python — no positions at all</text>
<text x="238" y="278.0" text-anchor="end" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1b19">MCP infra-diagram</text>
<rect x="250" y="262" width="54" height="30" rx="4" fill="#2a78d6"/>
<text x="314" y="278.0" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1b19">41</text>
