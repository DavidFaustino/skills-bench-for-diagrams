<line x1="250" y1="68" x2="250" y2="298" stroke="#e8e6df" stroke-width="1"/>
<text x="24" y="318" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6e6c66">The two cheapest inputs are the two that hand the layout to the tool — compare the outputs above.</text>
