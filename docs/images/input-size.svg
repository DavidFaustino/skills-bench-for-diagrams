<text x="710" y="94.0" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6e6c66">JSON — every node positioned by hand</text>
<text x="238" y="140.0" text-anchor="end" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1b1b19">MCP aws-samples</text>
