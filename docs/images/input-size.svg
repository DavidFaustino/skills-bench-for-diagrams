<rect x="250" y="170" width="144" height="30" rx="4" fill="#2a78d6"/>
<text x="404" y="186.0" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1b19">109</text>
<text x="434" y="186.0" dominant-baseline="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6e6c66">XML — shapes referenced by name</text>
