<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="336" viewBox="0 0 1040 336" role="img" aria-label="Lines of input each tool needed to draw the same diagram">
<title>Lines of input per tool</title>
<rect width="1040" height="336" rx="10" fill="#ffffff"/>
